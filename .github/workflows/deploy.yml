name: Deploy to GitHub Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Delete existing package version (if exists)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Checking for existing version: $VERSION"
          
          # List all versions and delete the matching one
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /users/fuping-ma-igt/packages/maven/com.actions.common/versions \
            --jq ".[] | select(.name==\"$VERSION\") | .id" | while read -r version_id; do
            
            if [ -n "$version_id" ]; then
              echo "Found version $VERSION (ID: $version_id), deleting..."
              gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                /users/fuping-ma-igt/packages/maven/com.actions.common/versions/$version_id
              echo "Deleted version $VERSION"
              sleep 5
            fi
          done
          
          echo "Deletion step completed"
      
      - name: Build with Maven
        run: mvn clean package -DskipTests -s .github/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Deploy to GitHub Packages
        run: mvn deploy -DskipTests -s .github/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

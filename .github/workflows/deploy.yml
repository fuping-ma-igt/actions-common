name: Deploy to GitHub Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Delete existing package version (if exists)
        continue-on-error: true
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          PACKAGE_NAME="com.actions.common"
          OWNER="fuping-ma-igt"
          REPO="actions-common"
          
          echo "Checking for existing version: $VERSION"
          echo "Package: $PACKAGE_NAME"
          
          # Try organization/repository endpoint first
          VERSIONS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/$OWNER/packages/maven/$PACKAGE_NAME/versions" 2>/dev/null)
          
          # If that fails, try user endpoint
          if [ -z "$VERSIONS" ] || [ "$VERSIONS" = "null" ]; then
            VERSIONS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/$OWNER/packages/maven/$PACKAGE_NAME/versions" 2>/dev/null)
          fi
          
          # Find version ID
          VERSION_ID=$(echo "$VERSIONS" | jq -r ".[] | select(.name==\"$VERSION\") | .id")
          
          if [ -n "$VERSION_ID" ] && [ "$VERSION_ID" != "null" ]; then
            echo "Found version $VERSION (ID: $VERSION_ID)"
            echo "Attempting to delete..."
            
            # Try organization endpoint
            curl -X DELETE -f \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/$OWNER/packages/maven/$PACKAGE_NAME/versions/$VERSION_ID" 2>/dev/null \
              || \
            # If that fails, try user endpoint
            curl -X DELETE -f \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/$OWNER/packages/maven/$PACKAGE_NAME/versions/$VERSION_ID"
            
            echo "Deleted version $VERSION"
            sleep 3
          else
            echo "Version $VERSION does not exist yet"
          fi
      
      - name: Build with Maven
        run: mvn clean package -DskipTests -s .github/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Deploy to GitHub Packages
        run: mvn deploy -DskipTests -s .github/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
